name: Release

# Tag a commit with v<versionName> from gradle.properties, e.g. v0.2.0:
#   git tag v0.2.0 && git push origin v0.2.0
# The job builds the signed APK, uploads it to the GitHub release and the in-app updater
# (:feature:update) starts offering it to installed builds.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v0.2.0 (must exist in gradle.properties)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve and check version
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PROPERTY_VERSION="$(grep '^honorToolkit.versionName=' gradle.properties | cut -d= -f2 | tr -d '\r')"
          VERSION_CODE="$(grep '^honorToolkit.versionCode=' gradle.properties | cut -d= -f2 | tr -d '\r')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          if [ -z "$VERSION_CODE" ]; then
            echo "::error::honorToolkit.versionCode is missing from gradle.properties"
            exit 1
          fi
          if [ "$VERSION" != "$PROPERTY_VERSION" ]; then
            echo "::error::Tag $TAG does not match honorToolkit.versionName=$PROPERTY_VERSION in gradle.properties"
            exit 1
          fi

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing signing secrets: SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/honor-toolkit-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/honor-toolkit-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Release APK
        run: chmod +x gradlew && ./gradlew :app:assembleRelease --console=plain

      - name: Prepare asset
        id: asset
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          ASSET="honor-toolkit-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$ASSET"
          sha256sum "$ASSET" > "$ASSET.sha256"
          cat "$ASSET.sha256"
          echo "path=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.name }}
          ASSET: ${{ steps.asset.outputs.path }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber
          else
            gh release create "$TAG" "$ASSET" "$ASSET.sha256" \
              --title "Honor Toolkit $VERSION" \
              --generate-notes \
              --verify-tag
          fi
