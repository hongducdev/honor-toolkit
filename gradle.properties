org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# Version shown in the app and published to GitHub. Bump both before tagging a release.
# The release workflow refuses a tag whose version differs from honorToolkit.versionName.
honorToolkit.versionCode=4
honorToolkit.versionName=0.2.1
# Used by :feature:update to read releases from the GitHub REST API.
honorToolkit.githubRepo=hongducdev/honor-toolkit
